<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowKit AI｜免費報價與客戶追蹤</title><meta name="description" content="免費、免註冊的報價與客戶追蹤工具。資料只存在你的瀏覽器。"><style>body{margin:0;background:#f5f8fc;color:#172b4d;font:16px system-ui,sans-serif}header{background:#102d55;color:white;padding:28px max(20px,calc((100vw - 950px)/2))}h1{font-size:38px;margin:8px 0}main{max-width:950px;margin:auto;padding:24px 16px}section{background:white;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 6px 24px #12284d12}label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #c8d3e0;border-radius:9px;font:inherit}button{background:#1677e9;color:white;border:0;border-radius:9px;padding:12px 18px;margin:10px 8px 0 0;font-weight:700;cursor:pointer}.secondary{background:#e8eff9;color:#17345d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.muted{color:#5d6b7e}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e5ebf3;text-align:left} .scroll{overflow:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:30px}}@media print{header,.no-print,button{display:none!important}body{background:white}section{box-shadow:none}}</style></head><body><header><div>FLOWKIT AI · 免費工具</div><h1>報價快一點，客戶不漏接</h1><p>免註冊、免安裝。快速建立報價、記錄狀態、追蹤下一次聯繫。</p></header><main><section><h2>建立報價</h2><div class="grid"><div><label>客戶名稱</label><input id="client" placeholder="例如：晨光設計"></div><div><label>聯絡資訊（選填）</label><input id="contact" placeholder="電子郵件或電話"></div><div><label>服務／商品</label><input id="item" placeholder="例如：網站設計"></div><div><label>單價（NT$）</label><input id="price" type="number" min="0" value="1000"></div><div><label>數量</label><input id="qty" type="number" min="1" value="1"></div><div><label>下次跟進日期</label><input id="follow" type="date"></div><div><label>狀態</label><select id="status"><option>待回覆</option><option>洽談中</option><option>已成交</option><option>未成交</option></select></div><div><label>備註</label><input id="note" placeholder="需求、有效期限等"></div></div><h3>報價總額：<span id="total">NT$1,000</span></h3><button onclick="save()">儲存報價</button><button class="secondary" onclick="window.print()">列印 / 存成 PDF</button></section><section class="no-print"><h2>客戶追蹤 <small id="due"></small></h2><p class="muted">資料只儲存在目前瀏覽器；更換裝置前請匯出備份。</p><div class="scroll"><table><thead><tr><th>客戶</th><th>項目</th><th>金額</th><th>狀態</th><th>跟進日</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><button onclick="exportCSV()">匯出 CSV</button><button class="secondary" onclick="backup()">匯出 JSON 備份</button><label>匯入 JSON 備份</label><input type="file" accept=".json,application/json" onchange="restore(event)"></section><section><h2>隱私與使用說明</h2><p>這是免費的本機瀏覽器工具，不會將你輸入的客戶資料傳送至 FlowKit 伺服器。清除瀏覽器資料可能導致紀錄遺失，請定期備份。跟進提醒只會在開啟本頁時顯示，不會自動發送郵件或通知。</p><p class="muted">試用版 · 不提供付費功能或收款。聯絡：<a href="mailto:hw.hsinyu@gmail.com?subject=FlowKit%20產品回饋">提供產品回饋</a></p></section></main><script>
const ids=['client','contact','item','price','qty','follow','status','note'],key='flowkit_v1_records';let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}
const el=id=>document.getElementById(id),money=n=>'NT$'+Number(n||0).toLocaleString('zh-TW');function calc(){el('total').textContent=money((+el('price').value||0)*(+el('qty').value||0))}['price','qty'].forEach(id=>el(id).addEventListener('input',calc));function persist(){localStorage.setItem(key,JSON.stringify(records));render()}
function save(){let o=Object.fromEntries(ids.map(id=>[id,el(id).value]));if(!o.client.trim()||!o.item.trim()){alert('請填寫客戶與項目');return}o.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);o.amount=(+o.price||0)*(+o.qty||0);records.unshift(o);persist();alert('已儲存')}
function render(){let due=0;el('rows').replaceChildren();for(const r of records){if(r.follow&&r.follow<=new Date().toISOString().slice(0,10)&&r.status!=='已成交'&&r.status!=='未成交')due++;let tr=document.createElement('tr');[r.client,r.item,money(r.amount),r.status,r.follow||'—'].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});let td=document.createElement('td'),b=document.createElement('button');b.textContent='刪除';b.className='secondary';b.onclick=()=>{if(confirm('刪除此紀錄？')){records=records.filter(x=>x.id!==r.id);persist()}};td.append(b);tr.append(td);el('rows').append(tr)}el('due').textContent=due?'（'+due+' 筆待跟進）':''}
function download(name,type,data){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download('flowkit-backup.json','application/json',JSON.stringify(records,null,2))}
function exportCSV(){let keys=['client','contact','item','price','qty','amount','status','follow','note'];let csv=[keys.join(','),...records.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');download('flowkit-quotes.csv','text/csv;charset=utf-8','\ufeff'+csv)}
async function restore(e){let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v)||!v.every(x=>x&&typeof x==='object'&&typeof x.client==='string'))throw Error('格式錯誤');if(confirm('匯入將取代目前紀錄，確定嗎？')){records=v;persist()}}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''}calc();render();
</script></body></html>
